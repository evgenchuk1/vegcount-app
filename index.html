<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ירקות">
<meta name="theme-color" content="#2E7D32">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ספירת ירקות ופירות</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body {
  font-family:-apple-system,'Heebo',Arial,sans-serif;
  background:#F0F4F0; direction:rtl;
  min-height:100vh; padding-bottom:50px;
}
.header {
  background:linear-gradient(135deg,#2E7D32 0%,#388E3C 100%);
  color:white; padding:16px 16px 14px;
  position:sticky; top:0; z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.header-top { display:flex; justify-content:space-between; align-items:center; }
.app-title { font-size:22px; font-weight:700; }
.app-title span { font-size:26px; margin-left:6px; }
.header-date { font-size:12px; opacity:.85; margin-top:2px; }
.btn-clear {
  background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.4);
  color:white; border-radius:20px; padding:6px 14px;
  font-size:13px; cursor:pointer; font-family:inherit;
}
.total-bar {
  background:white; border-bottom:2px solid #C8E6C9;
  padding:10px 16px; display:flex; justify-content:space-between; align-items:center;
}
.total-bar .label { font-size:14px; color:#555; }
.total-bar .count {
  font-size:20px; font-weight:700; color:#2E7D32;
  background:#E8F5E9; border-radius:20px; padding:2px 14px;
  min-width:50px; text-align:center;
}
.section { margin:12px 12px 0; }
.section-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; padding-right:4px; }
.section-header .icon { font-size:18px; }
.section-header .title {
  font-size:15px; font-weight:700; color:#1B5E20;
  text-transform:uppercase; letter-spacing:.04em;
}
.col-head {
  display:grid; grid-template-columns:1fr 58px 56px 64px;
  gap:4px; padding:0 10px 4px;
}
.col-head span { font-size:10px; color:#888; font-weight:600; text-align:center; }
.col-head span:first-child { text-align:right; }
.product-row {
  background:white; border:1px solid #E0E0E0; border-radius:12px;
  display:grid; grid-template-columns:1fr 58px 56px 64px;
  gap:4px; align-items:center; padding:8px 10px;
  margin-bottom:6px; transition:border-color .2s,background .2s;
}
.product-row.filled { border-color:#66BB6A; background:#F1F8F1; }
.product-name {
  display:flex; align-items:center; gap:4px; min-width:0;
}
.product-emoji { font-size:16px; flex-shrink:0; }
.product-label {
  font-size:13px; font-weight:600; color:#1A1A1A;
  flex:1; min-width:0; line-height:1.25;
}
.barcode-btn {
  background:#F5F5F5; border:1px solid #CCC; border-radius:5px;
  padding:3px 4px; cursor:pointer; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  transition:background .15s; line-height:0;
}
.barcode-btn:active { background:#DDD; }
.qty-input, .coeff-input {
  width:100%; border:1px solid #D0D0D0; border-radius:8px;
  padding:7px 3px; font-size:17px; font-weight:700;
  text-align:center; background:#FAFAFA; color:#1A1A1A;
  font-family:inherit; -webkit-appearance:none; appearance:none;
}
.qty-input:focus, .coeff-input:focus {
  outline:none; border-color:#2E7D32; background:white;
  box-shadow:0 0 0 3px rgba(46,125,50,.15);
}
.coeff-input { font-size:14px; color:#444; }
.total-display {
  background:#E8F5E9; border:1px solid #A5D6A7; border-radius:8px;
  padding:7px 3px; font-size:14px; font-weight:700;
  text-align:center; color:#2E7D32;
}
.total-display.has-value { background:#C8E6C9; border-color:#43A047; font-size:15px; }

/* Barcode modal */
.barcode-modal {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.75); z-index:500;
  justify-content:center; align-items:center;
}
.barcode-modal.open { display:flex; }
.barcode-card {
  background:white; border-radius:18px; padding:24px 20px 20px;
  max-width:320px; width:88%; text-align:center;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
}
.barcode-card .bc-name {
  font-size:18px; font-weight:700; color:#1B5E20;
  margin-bottom:18px; direction:rtl;
}
.barcode-img-wrap {
  background:#F5F5F5; border:2px dashed #BBB; border-radius:12px;
  padding:20px 16px 14px; margin-bottom:16px; cursor:pointer;
}
.barcode-hint { font-size:12px; color:#999; margin-top:10px; }
.barcode-close {
  background:#2E7D32; color:white; border:none; border-radius:10px;
  padding:13px 28px; font-size:16px; font-weight:700;
  cursor:pointer; font-family:inherit; width:100%;
}
.barcode-close:active { background:#1B5E20; }

.extras-card, .email-card, .actions-card {
  background:white; border:1px solid #E0E0E0; border-radius:14px;
  padding:14px 12px; margin:12px 12px 0;
}
.card-title {
  font-size:15px; font-weight:700; color:#555;
  margin-bottom:10px; display:flex; align-items:center; gap:6px;
}
.extras-col-head {
  display:grid; grid-template-columns:1fr 54px 52px 60px;
  gap:4px; padding:0 0 6px; margin-bottom:4px;
}
.extras-col-head span { font-size:10px; color:#888; font-weight:600; text-align:center; }
.extras-col-head span:first-child { text-align:right; }
.extra-row {
  display:grid; grid-template-columns:1fr 54px 52px 60px;
  gap:4px; margin-bottom:8px; align-items:center;
}
.extra-name-input {
  border:1px solid #D0D0D0; border-radius:10px;
  padding:8px 8px; font-size:14px; background:#FAFAFA;
  color:#1A1A1A; font-family:inherit; width:100%; text-align:right;
}
.extra-name-input::placeholder { color:#BBB; font-size:12px; }
.extra-name-input:focus { outline:none; border-color:#2E7D32; background:white; }
.email-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.email-label { font-size:14px; color:#555; font-weight:600; min-width:58px; }
.email-input {
  flex:1; border:1px solid #D0D0D0; border-radius:10px;
  padding:9px 10px; font-size:14px; background:#FAFAFA;
  color:#1A1A1A; font-family:inherit;
}
.email-input:focus { outline:none; border-color:#2E7D32; background:white; }
.email-input.prefilled { border-color:#81C784; background:#F1FBF1; }
.btn-action {
  display:block; width:100%; background:#2E7D32; color:white;
  border:none; border-radius:12px; padding:16px;
  font-size:17px; font-weight:700; cursor:pointer;
  font-family:inherit; margin-bottom:10px;
  box-shadow:0 3px 10px rgba(46,125,50,.25);
  transition:background .2s, transform .1s;
}
.btn-action:active { transform:scale(.97); background:#1B5E20; }
.btn-action.secondary { background:#1565C0; box-shadow:0 3px 10px rgba(21,101,192,.25); }
.btn-action.secondary:active { background:#0D47A1; }
.btn-action.tertiary { background:#00796B; box-shadow:0 3px 10px rgba(0,121,107,.25); }
.btn-action.tertiary:active { background:#004D40; }
.install-banner {
  background:#FFF8E1; border:1px solid #FFD54F; border-radius:12px;
  margin:12px 12px 0; padding:12px 14px;
  display:flex; gap:10px; align-items:flex-start;
}
.install-banner .ib-icon { font-size:22px; flex-shrink:0; margin-top:2px; }
.install-banner .ib-text { font-size:13px; color:#5D4037; line-height:1.6; }
.install-banner .ib-text b { color:#E65100; }
.ib-close { background:none; border:none; font-size:18px; color:#999; cursor:pointer; padding:0; margin-right:auto; flex-shrink:0; }
.toast {
  display:none; position:fixed; bottom:30px; left:50%;
  transform:translateX(-50%); background:#1B5E20; color:white;
  padding:14px 22px; border-radius:30px; font-size:15px; font-weight:600;
  z-index:999; max-width:88vw; text-align:center; line-height:1.5;
  box-shadow:0 4px 20px rgba(0,0,0,.25);
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="app-title"><span>🥦</span>ספירת ירקות ופירות</div>

<div class="total-bar">

  </div>

<div class="section">

  </div>
  <div class="col-head">

<div class="extras-card">
  <div class="card-title">📝 מוצרים נוספים</div>
  <div class="extras-col-head">
    <span>מוצר</span><span>ארגז</span><span>גורם</span><span>סה"כ ק"ג</span>
  </div>

</div>

<div class="email-card">
  <div class="card-title">📧 כתובות דוא"ל</div>
  <div class="email-row">
    <span class="email-label">בית:</span>
    <input type="email" class="email-input prefilled" id="email-home" value="evgenchuk1@gmail.com" dir="ltr">
  </div>
  <div class="email-row">
    <span class="email-label">עבודה:</span>
    <input type="email" class="email-input" id="email-work" placeholder="יתווסף בהמשך" dir="ltr">
  </div>
</div>

<div class="actions-card">
  <div class="card-title">⚡ פעולות</div>
  <button class="btn-action" onclick="sendEmail()">📧 שלח דו"ח במייל</button>
  <button class="btn-action secondary" onclick="shareReport()">📤 שתף דו"ח</button>
  <button class="btn-action tertiary" onclick="downloadCSV()">📥 הורד קובץ CSV</button>
</div>

<!-- Barcode Modal -->
<div class="barcode-modal" id="barcodeModal" onclick="closeBarcode()">
  <div class="barcode-card" onclick="event.stopPropagation()">
    <div class="bc-name" id="barcodeProductName"></div>
    <div class="barcode-img-wrap" onclick="closeBarcode()">
      <div id="barcodeNumber" style="font-size:26px;font-weight:900;letter-spacing:3px;font-family:monospace;color:#1B5E20;padding:14px 4px 8px;word-break:break-all;min-height:52px;"></div>
      <div class="barcode-hint" id="barcodeHint"></div>
    </div>
    <button class="barcode-close" onclick="closeBarcode()">סגור ✕</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const barcodeSVG = '<svg width="22" height="16" viewBox="0 0 22 16" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="2" height="16" fill="#444"/><rect x="3.5" y="0" width="1" height="16" fill="#444"/><rect x="5.5" y="0" width="2.5" height="16" fill="#444"/><rect x="9.5" y="0" width="1" height="16" fill="#444"/><rect x="11.5" y="0" width="2" height="16" fill="#444"/><rect x="14.5" y="0" width="1" height="16" fill="#444"/><rect x="16.5" y="0" width="3" height="16" fill="#444"/><rect x="20.5" y="0" width="1.5" height="16" fill="#444"/></svg>';

const vegetables = [
  {name:"עגבניות",             emoji:"🍅", coeff:6,  barcode:""},
  {name:"מלפפונים",            emoji:"🥒", coeff:6,  barcode:""},
  {name:"פלפלים",              emoji:"🫑", coeff:5,  barcode:""},
  {name:"פלפל אדום",           emoji:"🫑", coeff:5,  barcode:""},
  {name:"פלפל צהוב",           emoji:"🫑", coeff:5,  barcode:""},
  {name:"פלפל כתום",           emoji:"🫑", coeff:5,  barcode:""},
  {name:"פלפל ירוק",           emoji:"🫑", coeff:5,  barcode:""},
  {name:"פלפל ירוק חריף",      emoji:"🌶️", coeff:3,  barcode:""},
  {name:"בצל",                 emoji:"🧅", coeff:10, barcode:""},
  {name:"גזר",                 emoji:"🥕", coeff:10, barcode:""},
  {name:"תפוחי אדמה",          emoji:"🥔", coeff:10, barcode:""},
  {name:"תפוח אדמה לבן",       emoji:"🥔", coeff:10, barcode:""},
  {name:"תפוח אדמה לבן גורמה", emoji:"🥔", coeff:7,  barcode:""},
  {name:"תפוח אדמה אדום",      emoji:"🥔", coeff:10, barcode:""},
  {name:"תפוח אדמה קטן",       emoji:"🥔", coeff:5,  barcode:""},
  {name:"כרוב",                emoji:"🥬", coeff:8,  barcode:""},
  {name:"קישואים",             emoji:"🥒", coeff:6,  barcode:"7290000000824"},
  {name:"זוקיני ארוז",         emoji:"🥒", coeff:6,  barcode:"7296073417439"},
  {name:"חצילים",              emoji:"🍆", coeff:6,  barcode:""},
  {name:"שום",                 emoji:"🧄", coeff:5,  barcode:"6935325410118"},
  {name:"כרובית",              emoji:"🥦", coeff:8,  barcode:""},
  {name:"ברוקולי",             emoji:"🥦", coeff:5,  barcode:""},
  {name:"תרד",                 emoji:"🌿", coeff:4,  barcode:""},
  {name:"חסה",                 emoji:"🥗", coeff:6,  barcode:""},
  {name:"עגבניות שרי",         emoji:"🍅", coeff:5,  barcode:""},
  {name:"שרי עגול",            emoji:"🍅", coeff:5,  barcode:"7290000000916"},
  {name:"שרי תמר",             emoji:"🍅", coeff:5,  barcode:"7290002766056"},
  {name:"בטטה",                emoji:"🍠", coeff:10, barcode:""},
  {name:"פטרייה",              emoji:"🍄", coeff:3,  barcode:""},
  {name:"סלרי",                emoji:"🌿", coeff:5,  barcode:""},
  {name:"לפת",                 emoji:"🥔", coeff:5,  barcode:"7290000000190"},
  {name:"קולרבי",              emoji:"🥦", coeff:5,  barcode:"7290000000220"},
  {name:"סלק ארוז",            emoji:"🍠", coeff:4,  barcode:"7290020423047"},
];

const fruits = [
  {name:"תפוחים",              emoji:"🍎", coeff:10, barcode:""},
  {name:"תפוח עץ פינקריספי",   emoji:"🍎", coeff:10, barcode:""},
  {name:"תפוח עץ סמיט",        emoji:"🍎", coeff:10, barcode:""},
  {name:"תפוח עץ גאלה",        emoji:"🍎", coeff:10, barcode:""},
  {name:"תפוח עץ קנזי",        emoji:"🍎", coeff:10, barcode:""},
  {name:"תפוח עץ מוזהב",       emoji:"🍎", coeff:10, barcode:""},
  {name:"תפוח עץ סטרקינג",     emoji:"🍎", coeff:10, barcode:""},
  {name:"תפוזים",              emoji:"🍊", coeff:10, barcode:""},
  {name:"בננות",               emoji:"🍌", coeff:13, barcode:""},
  {name:"ענבים",               emoji:"🍇", coeff:9,  barcode:""},
  {name:"ענבים אדומים",        emoji:"🍇", coeff:9,  barcode:"7290005678486"},
  {name:"ענבים לבנים",         emoji:"🍇", coeff:9,  barcode:"7290013128317"},
  {name:"אבטיח",               emoji:"🍉", coeff:10, barcode:"7290000965031"},
  {name:"מלון",                emoji:"🍈", coeff:10, barcode:"7290000965055"},
  {name:"אגסים",               emoji:"🍐", coeff:8,  barcode:""},
  {name:"אגס אנג'ו",           emoji:"🍐", coeff:8,  barcode:"7290000964911"},
  {name:"מנגו",                emoji:"🥭", coeff:5,  barcode:""},
  {name:"תותים",               emoji:"🍓", coeff:3,  barcode:"7290000966779"},
  {name:"לימון",               emoji:"🍋", coeff:6,  barcode:""},
  {name:"אפרסק",               emoji:"🍑", coeff:6,  barcode:""},
  {name:"נקטרינה",             emoji:"🍑", coeff:6,  barcode:"7290000963969"},
  {name:"שזיף",                emoji:"🍑", coeff:6,  barcode:""},
  {name:"קלמנטינות",           emoji:"🍊", coeff:10, barcode:""},
  {name:"קיווי",               emoji:"🥝", coeff:5,  barcode:"7290000966656"},
  {name:"אננס",                emoji:"🍍", coeff:15, barcode:""},
];

function esc(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function makeRow(item, id) {
  const div = document.createElement('div');
  div.className = 'product-row'; div.id = 'row-' + id;
  div.innerHTML =
    '<div class="product-name">' +
      '<span class="product-emoji">' + item.emoji + '</span>' +
      '<span class="product-label">' + item.name + '</span>' +
      '<button class="barcode-btn" onclick="showBarcode(\'' + esc(item.name) + '\',\'' + (item.barcode||'') + '\')" title="ברקוד">' + barcodeSVG + '</button>' +
    '</div>' +
    '<input type="number" class="qty-input" id="' + id + '-qty"' +
      ' placeholder="0" min="0" step="1" inputmode="numeric"' +
      ' oninput="calcRow(\'' + id + '\')">' +
    '<input type="number" class="coeff-input" id="' + id + '-coeff"' +
      ' value="' + item.coeff + '" min="0" step="0.5" inputmode="decimal"' +
      ' oninput="calcRow(\'' + id + '\')">' +
    '<div class="total-display" id="' + id + '-total">0</div>';
  return div;
}

function calcRow(id) {
  const boxes = parseFloat(document.getElementById(id+'-qty')?.value) || 0;
  const coeff = parseFloat(document.getElementById(id+'-coeff')?.value) || 0;
  const total = boxes * coeff;
  const el = document.getElementById(id+'-total');
  if (el) {
    el.textContent = total > 0 ? (Number.isInteger(total) ? total : total.toFixed(1)) : '0';
    el.classList.toggle('has-value', total > 0);
  }
  const row = document.getElementById('row-'+id);
  if (row) row.classList.toggle('filled', boxes > 0);
  updateTotal();
}

function buildRows(items, cid) {
  const c = document.getElementById(cid);
  items.forEach((item, i) => c.appendChild(makeRow(item, cid+'-'+i)));
}

function buildExtras() {
  const c = document.getElementById('extras-rows');
  for (let i = 0; i < 5; i++) {
    const div = document.createElement('div'); div.className = 'extra-row';
    div.innerHTML =
      '<input type="text" class="extra-name-input" id="extra-name-' + i + '" placeholder="שם מוצר ' + (i+1) + '">' +
      '<input type="number" class="qty-input" id="extra-qty-' + i + '" placeholder="0" min="0" step="1" inputmode="numeric" oninput="calcExtra(' + i + ')">' +
      '<input type="number" class="coeff-input" id="extra-coeff-' + i + '" placeholder="0" min="0" step="0.5" inputmode="decimal" oninput="calcExtra(' + i + ')">' +
      '<div class="total-display" id="extra-total-' + i + '">0</div>';
    c.appendChild(div);
  }
}

function calcExtra(i) {
  const boxes = parseFloat(document.getElementById('extra-qty-'+i)?.value) || 0;
  const coeff = parseFloat(document.getElementById('extra-coeff-'+i)?.value) || 0;
  const total = boxes * coeff;
  const el = document.getElementById('extra-total-'+i);
  if (el) {
    el.textContent = total > 0 ? (Number.isInteger(total) ? total : total.toFixed(1)) : '0';
    el.classList.toggle('has-value', total > 0);
  }
  updateTotal();
}

function updateTotal() {
  let n = 0;
  vegetables.forEach((_,i) => { if (parseFloat(document.getElementById('vegetables-list-'+i+'-qty')?.value)||0) n++; });
  fruits.forEach((_,i)    => { if (parseFloat(document.getElementById('fruits-list-'+i+'-qty')?.value)||0) n++; });
  for (let i=0;i<5;i++) { if (parseFloat(document.getElementById('extra-qty-'+i)?.value)||0) n++; }
  document.getElementById('total-count').textContent = n;
}

function clearAll() {
  if (!confirm('למחוק את כל הנתונים?')) return;
  document.querySelectorAll('.qty-input').forEach(el => el.value = '');
  document.querySelectorAll('.extra-name-input').forEach(el => el.value = '');
  document.querySelectorAll('.product-row').forEach(el => el.classList.remove('filled'));
  document.querySelectorAll('.total-display').forEach(el => { el.textContent = '0'; el.classList.remove('has-value'); });
  vegetables.forEach((item,i) => {
    const el = document.getElementById('vegetables-list-'+i+'-coeff');
    if (el) el.value = item.coeff;
  });
  fruits.forEach((item,i) => {
    const el = document.getElementById('fruits-list-'+i+'-coeff');
    if (el) el.value = item.coeff;
  });
  document.querySelectorAll('.extra-row .coeff-input').forEach(el => el.value = '');
  updateTotal();
}

function getData() {
  const rows = [];
  vegetables.forEach((item,i) => {
    const boxes = parseFloat(document.getElementById('vegetables-list-'+i+'-qty')?.value)||0;
    const coeff = parseFloat(document.getElementById('vegetables-list-'+i+'-coeff')?.value)||0;
    if (boxes > 0) rows.push({cat:'ירקות', name:item.name, boxes, coeff, total:+(boxes*coeff).toFixed(2)});
  });
  fruits.forEach((item,i) => {
    const boxes = parseFloat(document.getElementById('fruits-list-'+i+'-qty')?.value)||0;
    const coeff = parseFloat(document.getElementById('fruits-list-'+i+'-coeff')?.value)||0;
    if (boxes > 0) rows.push({cat:'פירות', name:item.name, boxes, coeff, total:+(boxes*coeff).toFixed(2)});
  });
  for (let i=0;i<5;i++) {
    const name = (document.getElementById('extra-name-'+i)?.value||'').trim();
    const boxes = parseFloat(document.getElementById('extra-qty-'+i)?.value)||0;
    const coeff = parseFloat(document.getElementById('extra-coeff-'+i)?.value)||0;
    if (name && boxes > 0) rows.push({cat:'נוסף', name, boxes, coeff, total:+(boxes*coeff).toFixed(2)});
  }
  return rows;
}

function buildReportText(rows, dateStr) {
  let txt = 'ספירת ירקות ופירות — ' + dateStr + '\n';
  txt += '='.repeat(40) + '\n';
  let lastCat = '';
  rows.forEach(r => {
    if (r.cat !== lastCat) { txt += '\n' + r.cat + ':\n'; lastCat = r.cat; }
    let line = '  \u2022 ' + r.name + ': ' + r.boxes + ' ארגז';
    if (r.coeff > 0) line += ' \u00d7 ' + r.coeff + ' = ' + r.total + ' ק"ג';
    txt += line + '\n';
  });
  txt += '\nסה"כ פריטים: ' + rows.length;
  return txt;
}

function sendEmail() {
  const rows = getData();
  if (!rows.length) { showToast('לא הוזנו נתונים'); return; }
  const email1 = document.getElementById('email-home').value.trim();
  const email2 = document.getElementById('email-work').value.trim();
  const to = [email1, email2].filter(Boolean).join(',');
  if (!to) { showToast('נא להזין כתובת דוא"ל'); return; }
  const today = new Date().toLocaleDateString('he-IL');
  const subject = encodeURIComponent('ספירת ירקות ופירות — ' + today);
  const body = encodeURIComponent(buildReportText(rows, today));
  window.location.href = 'mailto:' + to + '?subject=' + subject + '&body=' + body;
}

function shareReport() {
  const rows = getData();
  if (!rows.length) { showToast('לא הוזנו נתונים'); return; }
  const today = new Date().toLocaleDateString('he-IL');
  const text = buildReportText(rows, today);
  if (navigator.share) {
    navigator.share({ title: 'ספירת ירקות', text }).catch(() => {});
  } else {
    navigator.clipboard?.writeText(text)
      .then(() => showToast('הדו"ח הועתק ללוח'))
      .catch(() => showToast('שתף: ' + text.substring(0,100) + '...'));
  }
}

function downloadCSV() {
  const rows = getData();
  if (!rows.length) { showToast('לא הוזנו נתונים'); return; }
  const today = new Date().toLocaleDateString('he-IL').replace(/\//g,'-');
  let csv = '\uFEFF' + 'קטגוריה,מוצר,ארגזים,גורם אירוז,סה"כ ק"ג\n';
  rows.forEach(r => csv += r.cat + ',' + r.name + ',' + r.boxes + ',' + r.coeff + ',' + r.total + '\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ספירה_' + today + '.csv';
  a.click(); URL.revokeObjectURL(url);
  showToast('\u2705 הקובץ הורד!');
}

function showBarcode(name, barcode) {
  document.getElementById('barcodeProductName').textContent = name;
  document.getElementById('barcodeNumber').textContent = barcode || '—';
  document.getElementById('barcodeHint').textContent = barcode ? 'לחץ לסגירה' : 'ברקוד לא זמין — לחץ לסגירה';
  document.getElementById('barcodeModal').classList.add('open');
}
function closeBarcode() {
  document.getElementById('barcodeModal').classList.remove('open');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 5000);
}

// Init
const now = new Date();
document.getElementById('dateStr').textContent =
  now.toLocaleDateString('he-IL', {weekday:'long',year:'numeric',month:'long',day:'numeric'});
buildRows(vegetables, 'vegetables-list');
buildRows(fruits, 'fruits-list');
buildExtras();

if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches)
  document.getElementById('installBanner').style.display = 'none';

if ('serviceWorker' in navigator)
  navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
