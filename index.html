<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ירקות">
<meta name="theme-color" content="#2E7D32">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ספירת ירקות ופירות</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body {
  font-family:-apple-system,'Heebo',Arial,sans-serif;
  background:#F0F4F0; direction:rtl;
  min-height:100vh; padding-bottom:50px;
}
.header {
  background:linear-gradient(135deg,#2E7D32 0%,#388E3C 100%);
  color:white; padding:16px 16px 14px;
  position:sticky; top:0; z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.header-top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.header-top > div:first-child { min-width:0; }
.app-title { font-size:22px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
@media (max-width:430px) { .app-title { font-size:17px; } .app-title span { font-size:20px; } .btn-search,.btn-clear { padding:6px 10px; white-space:nowrap; } }
.app-title span { font-size:26px; margin-left:6px; }
.header-date { font-size:12px; opacity:.85; margin-top:2px; }
.btn-clear {
  background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.4);
  color:white; border-radius:20px; padding:6px 14px;
  font-size:13px; cursor:pointer; font-family:inherit;
}
.total-bar {
  background:white; border-bottom:2px solid #C8E6C9;
  padding:10px 16px; display:flex; justify-content:space-between; align-items:center;
}
.total-bar .label { font-size:14px; color:#555; }
.total-bar .count {
  font-size:20px; font-weight:700; color:#2E7D32;
  background:#E8F5E9; border-radius:20px; padding:2px 14px;
  min-width:50px; text-align:center;
}
.section { margin:12px 12px 0; }
.section-header {
  display:flex; align-items:center; justify-content:center;
  gap:10px; margin-bottom:8px; padding:4px 0;
}
.section-header .icon { font-size:24px; }
.section-header .title {
  font-size:22px; font-weight:800; color:#1B5E20;
  letter-spacing:.03em;
}
.col-head {
  display:grid; grid-template-columns:1fr 72px 50px 68px;
  gap:4px; padding:0 10px 4px;
}
.col-head span { font-size:11px; color:#888; font-weight:600; text-align:center; }
.col-head span:first-child { text-align:right; }

/* ── product row ─────────────────────────────────────── */
.product-row {
  background:white; border:1px solid #E0E0E0; border-radius:12px;
  padding:8px 10px; margin-bottom:6px;
  transition:border-color .2s,background .2s;
}
.product-row.filled { border-color:#66BB6A; background:#F1F8F1; }

.product-top {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:6px; gap:4px;
}
.product-name {
  font-size:24px; font-weight:600; color:#1A1A1A;
  display:flex; align-items:center; gap:5px;
  flex:1; min-width:0;
}
.product-emoji { font-size:26px; flex-shrink:0; }
.product-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* barcode */
.barcode-section { flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:4px; }
.bc-btn {
  background:none; border:1px solid #ccc; border-radius:5px;
  padding:3px 6px; cursor:pointer; display:flex; align-items:center;
  color:#bbb; transition:all .15s; line-height:1;
}
.bc-btn.active { border-color:#66BB6A; color:#2E7D32; background:#E8F5E9; }
.bc-btn:disabled { cursor:default; opacity:.25; }
.bc-img {
  display:none; width:90vw; max-width:360px;
  border:1px solid #ccc; border-radius:5px; cursor:pointer; margin-top:4px;
}
.bc-img.visible { display:block; }
.bc-num {
  display:none; font-family:monospace; font-size:20px; font-weight:900;
  letter-spacing:3px; color:#1B5E20; padding:12px 8px;
  border:1px solid #A5D6A7; border-radius:5px; margin-top:4px;
  background:#F1FBF1; text-align:center; cursor:pointer;
  width:90vw; max-width:360px;
}
.bc-num.visible { display:block; }

/* ── input row ───────────────────────────────────────── */
.product-bottom {
  display:grid;
  grid-template-columns:1fr 50px 68px;
  gap:5px;
  align-items:center;
}

.entries-section { display:flex; flex-direction:column; gap:3px; }
.entry-row { display:flex; align-items:center; gap:3px; justify-content:flex-end; }

.box-input {
  width:64px; min-width:64px; flex:none;
  border:1px solid #D0D0D0; border-radius:8px;
  padding:7px 4px; font-size:18px; font-weight:700;
  text-align:center; background:#FAFAFA; color:#1A1A1A;
  font-family:inherit; -webkit-appearance:none; appearance:none;
}
.box-input:focus { outline:none; border-color:#2E7D32; background:white; box-shadow:0 0 0 3px rgba(46,125,50,.15); }

.btn-add-loc {
  flex-shrink:0; width:26px; height:34px;
  background:#E8F5E9; border:1px solid #A5D6A7; border-radius:8px;
  color:#2E7D32; font-size:18px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.btn-add-loc:active { background:#C8E6C9; }
.btn-remove-loc {
  flex-shrink:0; width:22px; height:34px;
  background:#FFEBEE; border:1px solid #FFCDD2; border-radius:8px;
  color:#C62828; font-size:15px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.btn-remove-loc:active { background:#FFCDD2; }

.coeff-input {
  width:50px; border:1px solid #D0D0D0; border-radius:8px;
  padding:7px 3px; font-size:13px; font-weight:600;
  text-align:center; background:#FAFAFA; color:#444;
  font-family:inherit; -webkit-appearance:none; appearance:none;
  display:block;
}
.coeff-input:focus { outline:none; border-color:#FF8F00; background:white; }

.total-val-box {
  width:68px;
  border:2.5px solid #1B5E20;
  border-radius:8px; padding:6px 3px;
  font-size:16px; font-weight:800;
  text-align:center; background:#E8F5E9; color:#1B5E20;
  min-height:34px; display:flex; align-items:center; justify-content:center;
}

/* extras / email / actions */
.extras-card, .email-card, .actions-card {
  background:white; border:1px solid #E0E0E0; border-radius:14px;
  padding:14px 12px; margin:12px 12px 0;
}
.card-title { font-size:15px; font-weight:700; color:#555; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.extra-row { display:grid; grid-template-columns:1fr 80px; gap:6px; margin-bottom:8px; align-items:center; }
.extra-name-input {
  border:1px solid #D0D0D0; border-radius:10px;
  padding:9px 10px; font-size:15px; background:#FAFAFA;
  color:#1A1A1A; font-family:inherit; width:100%; text-align:right;
}
.extra-name-input::placeholder { color:#BBB; font-size:13px; }
.extra-name-input:focus { outline:none; border-color:#2E7D32; background:white; }
.extra-qty-input {
  border:1px solid #D0D0D0; border-radius:10px;
  padding:9px 6px; font-size:17px; font-weight:700;
  text-align:center; background:#FAFAFA; color:#1A1A1A;
  font-family:inherit; -webkit-appearance:none; appearance:none; width:100%;
}
.extra-qty-input:focus { outline:none; border-color:#2E7D32; background:white; }
.email-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.email-label { font-size:14px; color:#555; font-weight:600; min-width:58px; }
.email-input {
  flex:1; border:1px solid #D0D0D0; border-radius:10px;
  padding:9px 10px; font-size:14px; background:#FAFAFA;
  color:#1A1A1A; font-family:inherit;
}
.email-input:focus { outline:none; border-color:#2E7D32; background:white; }
.email-input.prefilled { border-color:#81C784; background:#F1FBF1; }
.btn-action {
  display:block; width:100%; background:#2E7D32; color:white;
  border:none; border-radius:12px; padding:16px;
  font-size:17px; font-weight:700; cursor:pointer;
  font-family:inherit; margin-bottom:10px;
  box-shadow:0 3px 10px rgba(46,125,50,.25);
  transition:background .2s, transform .1s;
}
.btn-action:active { transform:scale(.97); background:#1B5E20; }
.btn-action.secondary { background:#1565C0; box-shadow:0 3px 10px rgba(21,101,192,.25); }
.btn-action.secondary:active { background:#0D47A1; }
.btn-action.tertiary { background:#00796B; box-shadow:0 3px 10px rgba(0,121,107,.25); }
.btn-action.tertiary:active { background:#004D40; }
.install-banner {
  background:#FFF8E1; border:1px solid #FFD54F; border-radius:12px;
  margin:12px 12px 0; padding:12px 14px;
  display:flex; gap:10px; align-items:flex-start;
}
.install-banner .ib-icon { font-size:22px; flex-shrink:0; margin-top:2px; }
.install-banner .ib-text { font-size:13px; color:#5D4037; line-height:1.6; }
.install-banner .ib-text b { color:#E65100; }
.ib-close { background:none; border:none; font-size:18px; color:#999; cursor:pointer; padding:0; margin-right:auto; flex-shrink:0; }
.toast {
  display:none; position:fixed; bottom:30px; left:50%;
  transform:translateX(-50%); background:#1B5E20; color:white;
  padding:14px 22px; border-radius:30px; font-size:15px; font-weight:600;
  z-index:999; max-width:88vw; text-align:center; line-height:1.5;
  box-shadow:0 4px 20px rgba(0,0,0,.25);
}
.btn-search {
  background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.4);
  color:white; border-radius:20px; padding:6px 14px;
  font-size:13px; cursor:pointer; font-family:inherit; margin-left:6px;
}
.search-bar {
  display:none; margin-top:10px; position:relative;
}
.search-bar.open { display:block; }
.search-input-field {
  width:100%; border:none; border-radius:10px;
  padding:10px 14px; font-size:16px; font-family:inherit;
  background:white; color:#1A1A1A; outline:none;
  direction:rtl;
}
.search-suggestions {
  display:none; position:absolute; top:calc(100% + 4px); right:0; left:0;
  background:white; border-radius:10px;
  box-shadow:0 4px 20px rgba(0,0,0,.25);
  max-height:260px; overflow-y:auto;
  z-index:300;
}
.search-sugg-item {
  padding:12px 14px; font-size:16px; cursor:pointer;
  display:flex; align-items:center; gap:8px;
  border-bottom:1px solid #F0F0F0; color:#1A1A1A;
}
.search-sugg-item:last-child { border-bottom:none; }
.search-sugg-item:active, .search-sugg-item:hover { background:#E8F5E9; }
.search-sugg-cat { font-size:11px; color:#888; margin-right:auto; flex-shrink:0; }
@keyframes row-flash {
  0%   { border-color:#2E7D32; background:#B9F6CA; box-shadow:0 0 0 3px rgba(46,125,50,.35); }
  70%  { border-color:#66BB6A; background:#E8F5E9; box-shadow:0 0 0 1px rgba(46,125,50,.1); }
  100% { box-shadow:none; }
}
.row-highlight { animation:row-flash 1.8s ease-out forwards; }

/* ── Alphabet wheel (3D drum) ──────────────────────────── */
.btn-abc {
  background:rgba(255,255,255,.95); border:none; color:#1B5E20;
  border-radius:12px; width:46px; height:40px; cursor:pointer;
  font-family:inherit; font-size:17px; font-weight:900; letter-spacing:-1px;
  box-shadow:0 3px 0 #A5D6A7, 0 5px 10px rgba(0,0,0,.25);
}
.btn-abc:active { transform:translateY(2px); box-shadow:0 1px 0 #A5D6A7; }
.abc-overlay {
  display:none; position:fixed; inset:0; z-index:500;
  background:radial-gradient(circle at 50% 45%, rgba(27,94,32,.55), rgba(0,0,0,.82));
  -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
  flex-direction:column; align-items:center; justify-content:center;
  touch-action:none; user-select:none; -webkit-user-select:none;
}
.abc-overlay.open { display:flex; }
.abc-cat {
  display:flex; background:rgba(255,255,255,.15); border-radius:30px; padding:4px; margin-bottom:14px;
}
.abc-cat button {
  border:none; background:none; color:white; font-family:inherit;
  font-size:18px; font-weight:700; padding:10px 22px; border-radius:26px; cursor:pointer;
}
.abc-cat button.on { background:white; color:#1B5E20; box-shadow:0 2px 8px rgba(0,0,0,.3); }
.abc-stage {
  position:relative; width:min(78vw,300px); height:min(62vh,470px);
  perspective:900px; perspective-origin:50% 50%;
}
.abc-stage::before, .abc-stage::after {   /* drum end caps / rails */
  content:''; position:absolute; top:4%; bottom:4%; width:16px; border-radius:8px; z-index:2;
  background:linear-gradient(90deg,#5d4037,#d7ccc8 45%,#8d6e63 55%,#3e2723);
  box-shadow:0 0 12px rgba(0,0,0,.6);
}
.abc-stage::before { right:-10px; } .abc-stage::after { left:-10px; }
.abc-drum {
  position:absolute; inset:0; transform-style:preserve-3d;
}
.abc-face {
  position:absolute; left:6px; right:6px; top:50%; height:76px; margin-top:-38px;
  display:flex; align-items:center; justify-content:center; gap:14px;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:linear-gradient(180deg,#fafafa 0%,#e8f5e9 45%,#c8e6c9 100%);
  border-top:1px solid rgba(255,255,255,.9); border-bottom:1px solid rgba(0,0,0,.25);
  color:#1B5E20; font-size:54px; font-weight:900; cursor:pointer;
  text-shadow:0 2px 0 #fff, 0 3px 3px rgba(0,0,0,.3);
}
.abc-face .cnt {
  font-size:15px; font-weight:700; color:#2E7D32; background:white;
  border-radius:12px; padding:2px 8px; text-shadow:none; box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.abc-face.empty { color:#a5b6a6; }
.abc-face.empty .cnt { display:none; }
.abc-shade {      /* cylinder lighting */
  position:absolute; inset:0; pointer-events:none; z-index:1; border-radius:10px;
  background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,0) 32%,rgba(0,0,0,0) 68%,rgba(0,0,0,.85) 100%);
}
.abc-window {     /* selection lens */
  position:absolute; left:-14px; right:-14px; top:50%; height:86px; margin-top:-43px;
  border:3px solid #FFD54F; border-radius:16px; pointer-events:none; z-index:3;
  box-shadow:0 0 0 2px rgba(0,0,0,.25), 0 0 22px rgba(255,213,79,.6), inset 0 0 14px rgba(255,213,79,.35);
}
.abc-hint { color:rgba(255,255,255,.85); font-size:14px; margin-top:16px; text-align:center; }
.abc-close {
  position:absolute; top:max(18px, env(safe-area-inset-top)); left:18px;
  width:46px; height:46px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(255,255,255,.2); color:white; font-size:24px;
}

/* ── Finish & send ─────────────────────────────────────── */
.btn-action.finish {
  background:linear-gradient(135deg,#E65100,#F57C00); font-size:19px; padding:18px;
  box-shadow:0 4px 14px rgba(230,81,0,.35);
}
.btn-action.finish:active { background:#BF360C; }
.send-status { font-size:13px; color:#555; text-align:center; margin:-4px 0 12px; line-height:1.5; }
.send-status.warn { color:#C62828; font-weight:600; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="app-title"><span>🥦</span>ספירת ירקות ופירות</div>
      <div class="header-date" id="dateStr"></div>
    </div>
    <div style="display:flex;gap:6px;align-items:center;">
      <button class="btn-abc" onclick="openAbc()" title="קפיצה לפי אות">אב</button>
      <button class="btn-search" onclick="toggleSearch()">🔍 חיפוש</button>
      <button class="btn-clear" onclick="clearAll()">🗑 נקה</button>
    </div>
  </div>
  <div class="search-bar" id="searchBar">
    <input type="text" class="search-input-field" id="searchInput"
      placeholder="חפש ירק / פרי..."
      oninput="onSearchInput(this.value)"
      onkeydown="if(event.key==='Escape')toggleSearch()">
    <div class="search-suggestions" id="searchSuggestions"></div>
  </div>
</div>

<div class="total-bar">
  <span class="label">פריטים שנספרו:</span>
  <span class="count" id="total-count">0</span>
</div>

<div class="install-banner" id="installBanner">
  <span class="ib-icon">📲</span>
  <div class="ib-text">
    <b>להוסיף לרקע הבית:</b> פתח ב-Safari ← לחץ על <b>שתף ⬆</b> ← <b>"הוסף למסך הבית"</b>
  </div>
  <button class="ib-close" onclick="document.getElementById('installBanner').style.display='none'">✕</button>
</div>

<div class="section">
  <div class="section-header">
    <span class="icon">🥕</span>
    <span class="title">ירקות</span>
  </div>
  <div class="col-head">
    <span>מוצר</span><span>ארגז</span><span>גורם</span><span>סה"כ ק"ג</span>
  </div>
  <div id="vegetables-list"></div>
</div>

<div class="section">
  <div class="section-header">
    <span class="icon">🍎</span>
    <span class="title">פירות</span>
  </div>
  <div class="col-head">
    <span>מוצר</span><span>ארגז</span><span>גורם</span><span>סה"כ ק"ג</span>
  </div>
  <div id="fruits-list"></div>
</div>

<div class="extras-card">
  <div class="card-title">📝 מוצרים נוספים</div>
  <div id="extras-rows"></div>
</div>

<div class="actions-card">
  <button class="btn-action finish" onclick="finishCount()">✅ סיים ספירה ושלח Excel</button>
  <div class="send-status" id="sendStatus"></div>
</div>

<div class="toast" id="toast"></div>

<div class="abc-overlay" id="abcOverlay">
  <button class="abc-close" onclick="closeAbc()">✕</button>
  <div class="abc-cat">
    <button id="abcCatV" class="on" onclick="setAbcCat('v')">🥕 ירקות</button>
    <button id="abcCatF" onclick="setAbcCat('f')">🍎 פירות</button>
  </div>
  <div class="abc-stage" id="abcStage">
    <div class="abc-drum" id="abcDrum"></div>
    <div class="abc-shade"></div>
    <div class="abc-window"></div>
  </div>
  <div class="abc-hint">גלגל למעלה / למטה ולחץ על אות</div>
</div>

<script src="xlsx-report.js"></script>
<script>
const BARCODE_SVG = `<svg width="20" height="13" viewBox="0 0 20 13" fill="currentColor">
  <rect x="0" y="0" width="1.8" height="13"/>
  <rect x="3.2" y="0" width="0.9" height="13"/>
  <rect x="5.2" y="0" width="2.2" height="13"/>
  <rect x="8.8" y="0" width="0.9" height="13"/>
  <rect x="10.8" y="0" width="1.8" height="13"/>
  <rect x="13.8" y="0" width="0.9" height="13"/>
  <rect x="15.8" y="0" width="2.2" height="13"/>
  <rect x="19.2" y="0" width="0.8" height="13"/>
</svg>`;

/* ── Data — ירקות sorted א–ת ──────────────────────────── */
const vegetables = [
  {id:'v0',  name:'ארטישוק',                      emoji:'🌿', coeff:16,   barcode:'barcodes/artichoke.gif'},
  {id:'v1',  name:'בטטה',                          emoji:'🍠', coeff:15.6, barcode:'barcodes/sweet-potato.gif'},
  {id:'v2',  name:'בטטה ארוזה',                    emoji:'🍠', coeff:12,   barcode:'barcodes/sweet-potato-baby.gif'},
  {id:'v3',  name:'בצל אדום',                      emoji:'🧅', coeff:16.3, barcode:'barcodes/onion-red.gif'},
  {id:'v4',  name:'בצל יבש',                       emoji:'🧅', coeff:14.4, barcode:'barcodes/onion-dry.gif'},
  {id:'v44', name:'בצל ירוק',                      emoji:'🌿', coeff:null, barcode:'barcodes/onion-green.gif'},
  {id:'v45', name:'בצלצלי שאלוט',                  emoji:'🧅', coeff:null, barcode:'barcodes/shallots.gif'},
  {id:'v5',  name:"ברוקולי ארוז (יח')",            emoji:'🥦', coeff:null, barcode:'barcodes/broccoli-packed.gif'},
  {id:'v6',  name:'גזר',                            emoji:'🥕', coeff:13,   barcode:'barcodes/carrot-packed.gif'},
  {id:'v7',  name:'דלורית',                         emoji:'🎃', coeff:14.1, barcode:'barcodes/butternut.gif'},

/* ── Row builder ──────────────────────────────────────── */
function makeRow(item) {
  const div = document.createElement('div');
  div.className = 'product-row';
  div.id = 'row-' + item.id;

  const hasImg = !!item.barcode;
  const hasNum = !!item.barcodeNum;
  let bcPart;
  if (hasImg) {
    bcPart = `<button class="bc-btn active" onclick="toggleBarcode('${item.id}')" title="הצג ברקוד">${BARCODE_SVG}</button>
       <img class="bc-img" id="bc-${item.id}" src="${item.barcode}" onclick="toggleBarcode('${item.id}')" alt="ברקוד">`;
  } else if (hasNum) {
    bcPart = `<button class="bc-btn active" onclick="toggleBarcode('${item.id}')" title="הצג ברקוד">${BARCODE_SVG}</button>
       <canvas class="bc-img" id="bc-${item.id}" onclick="toggleBarcode('${item.id}')"></canvas>`;
  } else {
    bcPart = `<button class="bc-btn" disabled title="אין ברקוד">${BARCODE_SVG}</button>`;
  }

  const cv = item.coeff !== null ? item.coeff : '';

  div.innerHTML = `
    <div class="product-top">
      <div class="product-name">
        <span class="product-emoji">${item.emoji}</span>
        <span class="product-label">${item.name}</span>
      </div>
      <div class="barcode-section">${bcPart}</div>
    </div>
    <div class="product-bottom">
      <div class="entries-section" id="entries-${item.id}">
        <div class="entry-row">
          <input type="number" class="box-input" data-id="${item.id}"
            placeholder="0" min="0" step="0.5" inputmode="decimal"
            oninput="calcRow('${item.id}')">
          <button class="btn-add-loc" onclick="addEntry('${item.id}')" title="הוסף מיקום">+</button>
        </div>
      </div>
      <input type="number" class="coeff-input" id="coeff-${item.id}"
        value="${cv}" placeholder="—" step="0.1" inputmode="decimal"
        oninput="calcRow('${item.id}')">
      <div class="total-val-box" id="tot-${item.id}">—</div>
    </div>`;
  return div;
}

function buildRows(items, cid) {
  const c = document.getElementById(cid);
  items.forEach(item => c.appendChild(makeRow(item)));
}

/* ── Multi-location ────────────────────────────────────── */
function addEntry(id) {
  const area = document.getElementById('entries-' + id);
  const row = document.createElement('div');
  row.className = 'entry-row';
  row.innerHTML = `
    <input type="number" class="box-input" data-id="${id}"
      placeholder="0" min="0" step="0.5" inputmode="decimal"
      oninput="calcRow('${id}')">
    <button class="btn-remove-loc" onclick="removeEntry(this,'${id}')" title="הסר">×</button>`;
  area.appendChild(row);
}

function removeEntry(btn, id) {
  btn.closest('.entry-row').remove();
  calcRow(id);
}

/* ── Calculation ───────────────────────────────────────── */
function calcRow(id) {
  const inputs = document.querySelectorAll(`.box-input[data-id="${id}"]`);
  let boxes = 0;
  inputs.forEach(inp => { boxes += parseFloat(inp.value) || 0; });

  const coeff = parseFloat(document.getElementById('coeff-' + id)?.value) || 0;
  const kg = boxes * coeff;

  const totEl = document.getElementById('tot-' + id);
  if (totEl) {
    if (boxes === 0)       totEl.textContent = '—';
    else if (coeff === 0)  totEl.textContent = boxes + '×?';
    else                   totEl.textContent = kg % 1 === 0 ? kg : kg.toFixed(1);
  }

  const rowEl = document.getElementById('row-' + id);
  if (rowEl) rowEl.classList.toggle('filled', boxes > 0);
  updateTotal();
}

function toggleBarcode(id) {
  document.getElementById('bc-' + id)?.classList.toggle('visible');
}

/* ── Extras ────────────────────────────────────────────── */
function buildExtras() {
  const c = document.getElementById('extras-rows');
  for (let i = 0; i < 5; i++) {
    const div = document.createElement('div');
    div.className = 'extra-row';
    div.innerHTML = `
      <input type="text" class="extra-name-input" id="extra-name-${i}" placeholder="שם מוצר ${i+1}">
      <input type="number" class="extra-qty-input" id="extra-qty-${i}"
        placeholder='ק"ג' min="0" step="0.5" inputmode="decimal" oninput="updateTotal()">`;
    c.appendChild(div);
  }
}

function updateTotal() {
  let n = 0;
  [...vegetables, ...fruits].forEach(item => {
    let boxes = 0;
    document.querySelectorAll(`.box-input[data-id="${item.id}"]`)
      .forEach(inp => { boxes += parseFloat(inp.value) || 0; });
    if (boxes > 0) n++;
  });
  for (let i = 0; i < 5; i++) {
    if (parseFloat(document.getElementById('extra-qty-' + i)?.value) || 0) n++;
  }
  document.getElementById('total-count').textContent = n;
}

/* ── Clear ─────────────────────────────────────────────── */
function clearAll() {
  if (!confirm('למחוק את כל הנתונים?')) return;
  [...vegetables, ...fruits].forEach(item => {
    const area = document.getElementById('entries-' + item.id);
    if (area) {
      const rows = area.querySelectorAll('.entry-row');
      rows.forEach((row, i) => {
        if (i === 0) { const inp = row.querySelector('.box-input'); if (inp) inp.value = ''; }
        else row.remove();
      });
    }
    const cEl = document.getElementById('coeff-' + item.id);
    if (cEl) cEl.value = item.coeff !== null ? item.coeff : '';
    const tEl = document.getElementById('tot-' + item.id);
    if (tEl) tEl.textContent = '—';
    document.getElementById('row-' + item.id)?.classList.remove('filled');
    document.getElementById('bc-' + item.id)?.classList.remove('visible');
  });
  for (let i = 0; i < 5; i++) {
    const n = document.getElementById('extra-name-' + i);
    const q = document.getElementById('extra-qty-' + i);
    if (n) n.value = ''; if (q) q.value = '';
  }
  updateTotal();
}

/* ── Data collector ────────────────────────────────────── */
function getData() {
  const rows = [];
  const proc = (item, cat) => {
    const inputs = document.querySelectorAll(`.box-input[data-id="${item.id}"]`);
    const parts = [];
    let boxes = 0;
    inputs.forEach(inp => { const v = parseFloat(inp.value) || 0; if (v > 0) parts.push(v); boxes += v; });
    if (boxes > 0) {
      const coeff = parseFloat(document.getElementById('coeff-' + item.id)?.value) || 0;
      rows.push({ cat, name: item.name, boxes, parts, coeff, kg: boxes * coeff });
    }
  };
  vegetables.forEach(item => proc(item, 'ירקות'));
  fruits.forEach(item => proc(item, 'פירות'));
  for (let i = 0; i < 5; i++) {
    const name = (document.getElementById('extra-name-' + i)?.value || '').trim();
    const qty = parseFloat(document.getElementById('extra-qty-' + i)?.value) || 0;
    if (name && qty > 0) rows.push({ cat: 'נוסף', name, boxes: null, parts: [], coeff: null, kg: qty });
  }
  return rows;
}

function buildReport(rows, dateStr) {
  let txt = 'ספירת ירקות ופירות — ' + dateStr + '\n' + '='.repeat(40) + '\n';
  let lastCat = '';
  rows.forEach(r => {
    if (r.cat !== lastCat) { txt += '\n' + r.cat + ':\n'; lastCat = r.cat; }
    if (r.boxes !== null) {
      const boxStr = r.parts.length > 1 ? r.parts.join('+') + '=' + r.boxes : '' + r.boxes;
      const kgStr = r.coeff ? ' × ' + r.coeff + ' = ' + (r.kg % 1 === 0 ? r.kg : r.kg.toFixed(1)) + ' ק"ג' : ' ארגז';
      txt += '  • ' + r.name + ': ' + boxStr + ' ארגז' + kgStr + '\n';
    } else {
      txt += '  • ' + r.name + ': ' + r.kg + ' ק"ג\n';
    }
  });
  txt += '\nסה"כ פריטים: ' + rows.length;
  return txt;
}

  if (!q) { sugg.style.display = 'none'; sugg.innerHTML = ''; return; }
  const matches = allSearchItems.filter(i => i.name.includes(q));
  if (!matches.length) { sugg.style.display = 'none'; sugg.innerHTML = ''; return; }
  sugg.innerHTML = matches.slice(0, 12).map(i =>
    `<div class="search-sugg-item" onclick="jumpToItem('${i.id}')">
      <span>${i.emoji}</span>
      <span>${i.name}</span>
      <span class="search-sugg-cat">${i.cat}</span>
    </div>`
  ).join('');
  sugg.style.display = 'block';
}

function jumpToItem(id) {

}

/* ── Alphabet wheel (3D drum) ──────────────────────────────────────── */
const ABC = 'אבגדהוזחטיכלמנסעפצקרשת'.split('');
const ABC_STEP = 360 / ABC.length;
const ABC_FACE_H = 76;
const ABC_R = (ABC_FACE_H / 2) / Math.tan(Math.PI / ABC.length);
let abcCat = 'v', abcRot = 0, abcAnim = null;

function abcItems(cat) {
  return (cat === 'v' ? vegetables : fruits).slice().sort(byNameHe);
}

function buildAbc() {
  const drum = document.getElementById('abcDrum');
  const items = abcItems(abcCat);
  drum.innerHTML = ABC.map((l, i) => {
    const n = items.filter(it => it.name.startsWith(l)).length;
    return `<div class="abc-face${n ? '' : ' empty'}" data-i="${i}"
      style="transform:rotateX(${-i * ABC_STEP}deg) translateZ(${ABC_R}px)">
      <span>${l}</span><span class="cnt">${n}</span></div>`;
  }).join('');
  renderAbc();
}

function renderAbc() {
  document.getElementById('abcDrum').style.transform =
    `translateZ(${-ABC_R}px) rotateX(${abcRot}deg)`;
  document.querySelectorAll('.abc-face').forEach((f, i) => {
    let d = ((abcRot - i * ABC_STEP) % 360 + 540) % 360 - 180;   // −180..180
    f.style.filter = `brightness(${Math.max(.35, Math.cos(d * Math.PI / 180)).toFixed(2)})`;
  });
}

function abcIndex() { return ((Math.round(abcRot / ABC_STEP) % ABC.length) + ABC.length) % ABC.length; }

function animateAbcTo(target, ms, done) {
  cancelAnimationFrame(abcAnim);
  const from = abcRot, t0 = performance.now();
  const tick = t => {
    const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    abcRot = from + (target - from) * e; renderAbc();
    if (k < 1) abcAnim = requestAnimationFrame(tick); else done && done();
  };
  abcAnim = requestAnimationFrame(tick);
}

function snapAbc() { animateAbcTo(Math.round(abcRot / ABC_STEP) * ABC_STEP, 220); }

function setAbcCat(c) {
  abcCat = c;
  document.getElementById('abcCatV').classList.toggle('on', c === 'v');
  document.getElementById('abcCatF').classList.toggle('on', c === 'f');
  buildAbc();
}

function openAbc() {
  if (document.getElementById('searchBar').classList.contains('open')) toggleSearch();
  document.getElementById('abcOverlay').classList.add('open');
  buildAbc();
}
function closeAbc() { document.getElementById('abcOverlay').classList.remove('open'); }

function jumpToLetter(i) {
  const letter = ABC[i];
  const hits = abcItems(abcCat).filter(it => it.name.startsWith(letter));
  if (!hits.length) { showToast('אין מוצרים באות ' + letter); return; }
  closeAbc();
  const first = document.getElementById('row-' + hits[0].id);
  const headerH = document.querySelector('.header').offsetHeight;
  window.scrollTo({ top: first.getBoundingClientRect().top + window.scrollY - headerH - 10, behavior: 'smooth' });
  hits.forEach(it => {
    const row = document.getElementById('row-' + it.id);
    row.classList.remove('row-highlight'); void row.offsetWidth; row.classList.add('row-highlight');
    setTimeout(() => row.classList.remove('row-highlight'), 1900);
  });
}

(function initAbcGestures() {
  const stage = document.getElementById('abcStage');
  const DEG_PER_PX = 180 / Math.PI / ABC_R;
  let startY = 0, lastY = 0, lastT = 0, vel = 0, moved = 0, down = false;

  stage.addEventListener('pointerdown', e => {
    cancelAnimationFrame(abcAnim);
    down = true; moved = 0; vel = 0;
    startY = lastY = e.clientY; lastT = performance.now();
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if (!down) return;
    const now = performance.now(), dy = e.clientY - lastY;
    abcRot -= dy * DEG_PER_PX;
    vel = -dy * DEG_PER_PX / Math.max(1, now - lastT);
    moved = Math.max(moved, Math.abs(e.clientY - startY));
    lastY = e.clientY; lastT = now; renderAbc();
  });
  stage.addEventListener('pointerup', e => {
    if (!down) return; down = false;
    if (moved < 8) {                               // tap → choose letter
      const el = document.elementsFromPoint(e.clientX, e.clientY).find(x => x.classList?.contains('abc-face'));
      const i = el ? +el.dataset.i : abcIndex();
      let target = abcRot + ((((i * ABC_STEP - abcRot) % 360) + 540) % 360 - 180);
      animateAbcTo(target, 200, () => jumpToLetter(i));
      return;
    }
    if (performance.now() - lastT > 80) vel = 0;  // finger stopped before release
    const coast = () => {                          // inertia, then snap
      vel *= 0.95; abcRot += vel * 16; renderAbc();
      if (Math.abs(vel) > 0.01) abcAnim = requestAnimationFrame(coast); else snapAbc();
    };
    abcAnim = requestAnimationFrame(coast);
  });
  stage.addEventListener('pointercancel', () => { down = false; snapAbc(); });

  let wheelT;
  stage.addEventListener('wheel', e => {
    e.preventDefault(); cancelAnimationFrame(abcAnim);
    abcRot += e.deltaY * 0.12; renderAbc();
    clearTimeout(wheelT); wheelT = setTimeout(snapAbc, 120);
  }, { passive: false });
})();

/* ── Finish count → Excel → auto e-mail ────────────────────────────── */
// Google Apps Script web-app (sends from Gmail to the fixed recipient list kept in the script)
const REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxQcz1hL-kStHmSysz4gyEVA1ZomvXGaLWbMAbGOBpfJxwnucBV_84RCfg3MLC0gtji/exec';
const REPORT_KEY = 'veg118';
const BRANCH = '118';
const QUEUE_KEY = 'vegcount-pending-report';

async function loadExcelJS() {
  if (window.ExcelJS) return;
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    s.onload = res; s.onerror = () => rej('לא ניתן לטעון ExcelJS');
    document.head.appendChild(s);
  });
}

function collectSections() {
  const rowsOf = items => items.slice().sort(byNameHe).map(item => {
    const parts = [];
    document.querySelectorAll(`.box-input[data-id="${item.id}"]`)
      .forEach(inp => { const v = parseFloat(inp.value) || 0; if (v > 0) parts.push(v); });
    const boxes = parts.reduce((a, b) => a + b, 0);
    const coeff = parseFloat(document.getElementById('coeff-' + item.id)?.value) || 0;
    return { name: item.name, parts, boxes, coeff, kg: boxes * coeff };
  });
  const extras = [];
  for (let i = 0; i < 5; i++) {
    const name = (document.getElementById('extra-name-' + i)?.value || '').trim();
    const kg = parseFloat(document.getElementById('extra-qty-' + i)?.value) || 0;
    if (name && kg > 0) extras.push({ name, parts: [], boxes: 0, coeff: 0, kg, extra: true });
  }
  return [
    { title: 'ירקות', icon: '🥕', color: 'FFDCEDC8', rows: rowsOf(vegetables) },
    { title: 'פירות', icon: '🍎', color: 'FFFCE4EC', rows: rowsOf(fruits) },
    { title: 'מוצרים נוספים', icon: '📝', color: 'FFFFF3E0', rows: extras },
  ];
}

function bufToB64(buf) {
  const bytes = new Uint8Array(buf); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

function setSendStatus(msg, warn) {
  const el = document.getElementById('sendStatus');
  el.textContent = msg; el.classList.toggle('warn', !!warn);
}

async function postReport(payload) {
  const r = await fetch(REPORT_ENDPOINT, { method: 'POST', body: JSON.stringify(payload) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'שגיאת שרת');
}

async function finishCount() {
  const rows = getData();
  if (!rows.length) { showToast('לא הוזנו נתונים'); return; }
  if (!confirm('לסיים את הספירה ולשלוח קובץ Excel לכל הנמענים?')) return;

  showToast('מכין קובץ Excel...');
  try { await loadExcelJS(); } catch (e) { showToast('שגיאה: ' + e); return; }
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const date = `${pad(now.getDate())}.${pad(now.getMonth() + 1)}.${now.getFullYear()}`;
  const time = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const wb = buildCountWorkbook(ExcelJS, collectSections(), { date, time, branch: BRANCH });
  const buf = await wb.xlsx.writeBuffer();
  const filename = `ספירת_ירקות_ופירות_${date}.xlsx`;

  if (!REPORT_ENDPOINT) {                 // auto-send not configured yet → share / download
    const file = new File([buf], filename, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: filename }).catch(() => {});
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = filename; a.click();
    }
    setSendStatus('שליחה אוטומטית עדיין לא הוגדרה — הקובץ נשמר/שותף', true);
    return;
  }

  const payload = {
    key: REPORT_KEY, filename, b64: bufToB64(buf),
    subject: `ספירת ירקות ופירות — סניף ${BRANCH} — ${date}`,
    body: buildReport(rows, date),
  };
  showToast('שולח...');
  try {
    await postReport(payload);
    try { localStorage.removeItem(QUEUE_KEY); } catch (e) {}
    setSendStatus(`✅ נשלח בהצלחה ב-${time}`);
    showToast('✅ הדו"ח נשלח במייל!');
  } catch (e) {
    try { localStorage.setItem(QUEUE_KEY, JSON.stringify(payload)); } catch (e2) {}
    setSendStatus('⚠️ אין חיבור — הדו"ח יישלח אוטומטית כשהאינטרנט יחזור', true);
    showToast('⚠️ השליחה נכשלה — יישלח שוב אוטומטית');
  }
}

async function retryPendingReport() {
  if (!REPORT_ENDPOINT) return;
  let p; try { p = JSON.parse(localStorage.getItem(QUEUE_KEY) || 'null'); } catch (e) { return; }
  if (!p) return;
  try {
    await postReport(p);
    localStorage.removeItem(QUEUE_KEY);
    setSendStatus('✅ דו"ח שהמתין נשלח בהצלחה');
    showToast('✅ דו"ח שהמתין נשלח!');
  } catch (e) {}
}
window.addEventListener('online', retryPendingReport);
retryPendingReport();
